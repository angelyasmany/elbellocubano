<script>
  async function cargarEstadisticasComunidad() {
    try {
      // Ajusta la ruta si tu API está en otra carpeta (ej: '/api/tiktok')
      const response = await fetch('/api/tiktok');
      
      if (!response.ok) {
        throw new Error('Error en la respuesta de la red');
      }

      const data = await response.json();

      // 1. Pintar TikTok con formato de miles (ej. 43,700)
      const tiktokEl = document.getElementById('tiktok-count');
      if (tiktokEl) {
        tiktokEl.textContent = Number(data.tiktok).toLocaleString('es-ES');
      }

      // 2. Pintar Facebook (si tienes el span id="facebook-count")
      const fbEl = document.getElementById('facebook-count');
      if (fbEl) {
        fbEl.textContent = Number(data.facebook).toLocaleString('es-ES');
      }

      // 3. Pintar Instagram (si tienes el span id="instagram-count")
      const igEl = document.getElementById('instagram-count');
      if (igEl) {
        igEl.textContent = Number(data.instagram).toLocaleString('es-ES');
      }

      console.log(`[El Bello Cubano] Estadísticas cargadas exitosamente vía: ${data.source}`);
      
    } catch (error) {
      console.error("No se pudieron actualizar los contadores en tiempo real:", error);
      
      // Respaldo visual en el cliente si la API entera falla
      const tiktokEl = document.getElementById('tiktok-count');
      if (tiktokEl && tiktokEl.textContent.trim() === '') {
        tiktokEl.textContent = "43.700"; 
      }
    }
  }

  // Ejecutar de forma automática al cargar la página
  document.addEventListener('DOMContentLoaded', cargarEstadisticasComunidad);
</script>
