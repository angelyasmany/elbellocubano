<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f0">
<meta name="description" content="El Bello Cubano: limpieza de tanques de agua, promoción de negocios y clases de música.">
<title>El Bello Cubano | Servicios</title>
<style>
:root { color-scheme: light; --blue:#0878e9; --ink:#06133d; }
*,*::before,*::after { box-sizing:border-box; }
html { background:#f7f1eb; }
body { margin:0; min-height:100svh; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink);
       display:flex; align-items:flex-start; justify-content:center; background:linear-gradient(180deg,#d7ecfd,#f9efe4 54%,#fffaf4); }
button {font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus-visible {outline:3px solid #ff5b3d;outline-offset:3px;}
.poster { position:relative; width:min(100%,1024px,66.6667svh); aspect-ratio:2/3;
  isolation:isolate; margin:0 auto; user-select:none; -webkit-user-select:none; touch-action:pan-y;
  background:#fff7f0; overflow:hidden;box-shadow:0 15px 50px rgba(32,35,60,.08); }
.poster-picture{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;}

/* Saludo REAL de bienvenida, sobre el cielo azul de la misma imagen original. */
.poster { container-type:inline-size; }
.welcome-message {
  position:absolute;
  top:7.15%;
  right:3.9%;
  width:47.8%;
  z-index:6;
  pointer-events:none;
  text-align:left;
  filter:drop-shadow(0 1px 2px rgba(255,255,255,.75));
}
.welcome-message h1 {
  display:block;
  padding:0;
  margin:0;
  color:#10141c;
  font-family:Arial,"Arial Black",system-ui,sans-serif;
  font-weight:900;
  font-size:clamp(16px,4.70cqw,49px);
  letter-spacing:-.045em;
  line-height:1.04;
  white-space:nowrap;
}
.welcome-message h1 .saludo-rojo { color:#e71939; }
.welcome-message p {
  color:#182130;
  font-family:Arial,system-ui,sans-serif;
  font-size:clamp(10px,2.55cqw,26px);
  line-height:1.18;
  font-weight:500;
  letter-spacing:-.02em;
  margin:.34em 0 0;
  max-width:100%;
  text-wrap:pretty;
}

.tap-area {position:absolute;border:0;background:transparent;color:transparent;padding:0;margin:0;z-index:4;}
.tap-area:focus-visible {outline:3px solid var(--blue);border-radius:16px;background:rgba(0,119,255,.1);}
.price-1 {left:5.3%;top:76.15%;width:26.65%;height:4.05%;}
.price-2 {left:37.3%;top:76.15%;width:25.8%;height:4.05%;}
.price-3 {left:68.4%;top:76.15%;width:26.2%;height:4.05%;}
.arrow-prev{left:0.3%;top:55.9%;width:7.0%;height:5.1%;border-radius:50%;}
.arrow-next{right:0.25%;top:55.9%;width:7.0%;height:5.1%;border-radius:50%;}
.page-dot {width:2.7%;height:2%;top:81.7%;border-radius:50%;}
.page-dot.d0{left:45.9%;}.page-dot.d1{left:48.9%;}.page-dot.d2{left:51.9%;}
.social-hit {top:84.3%;height:12.3%;width:21.4%;border-radius:16px;}
.social-hit.s0{left:3.9%;}.social-hit.s1{left:27%;}.social-hit.s2{left:52%;}.social-hit.s3{left:75%;}
/* The initial view is the untouched approved source image, pixel for pixel.
   Only after manual navigation is the carousel re-composed from exact crops of this same image. */
.carousel-layer {position:absolute;z-index:2;left:0;right:0;top:45.7%;height:38.0%;
  background:linear-gradient(180deg,#ddbfaa 0%,#f4e6d9 16%,#fdf8f4 57%,#fffaf5 100%);
  pointer-events:none;opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s .28s;}
.poster.moved .carousel-layer {opacity:1;visibility:visible;transition:opacity .28s ease;}
.carousel-card{position:absolute;top:1.95%;height:92.8%;width:31.6%;z-index:2;will-change:left, transform, opacity;
  transition:left .88s cubic-bezier(.22,1,.36,1),transform .88s cubic-bezier(.22,1,.36,1),opacity .88s ease;
  filter:drop-shadow(0px 5px 7px rgba(80,50,30,.09));}
.carousel-card img{width:100%;height:100%;object-fit:fill;display:block;}
.carousel-card.returning{z-index:1;transform:scale(.93);opacity:.65;}
.carousel-arr{position:absolute;z-index:4;top:27.2%;width:6.5%;aspect-ratio:1/1;border-radius:50%;
  background:#fff; box-shadow:0 3px 13px rgba(0,0,0,.13);display:grid;place-items:center;color:#091843;}
.carousel-arr.left{left:.7%;}.carousel-arr.right{right:.7%;}
.carousel-arr svg{width:42%;height:48%;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:4;}
.carousel-dots{position:absolute;left:0;right:0;bottom:0.7%;display:flex;justify-content:center;gap:1.35%;height:2.9%;align-items:center;}
.carousel-dots i{display:block;width:1.7%;aspect-ratio:1/1;border-radius:50%;background:#d3d3d3;}
.carousel-dots i.current{background:#0079ee;}
.dialog-backdrop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
  background:rgba(4,16,45,.52);padding:20px;backdrop-filter:blur(4px);}
.dialog-backdrop.visible{display:flex;}
.dialog{width:min(100%,410px);border-radius:21px;background:#fff;text-align:center;padding:28px 22px;
  box-shadow:0 15px 60px #0004; position:relative;}
.dialog h2{font-size:21px;line-height:1.22;margin:0 0 12px;}
.dialog p{font-size:15px;line-height:1.5;margin:0 0 22px;color:#3b4664;}
.dialog button{background:var(--blue);border:0;border-radius:24px;color:#fff;padding:10px 30px;font-weight:750;}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;
  clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
@media(max-width:340px){.poster {width:100%;}}
@media(prefers-reduced-motion:reduce){.carousel-card,.carousel-layer{transition:none!important;}}
</style>
</head>

   <h1>El Bello Cubano</h1>
   <h2>Limpieza de tanques de agua</h2><p>Limpieza y desinfección. Ica.</p>
   <h2>Promociona tu negocio o marca</h2><p>Aumenta tu visibilidad de forma creativa.</p>
   <h2>Clases de música</h2><p>Piano, guitarra, batería y canto.</p>
  </section>
</main>
<div class="dialog-backdrop" id="dialog" role="presentation">
 <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogText">
  <h2 id="dialogTitle"></h2><p id="dialogText"></p>
  <button type="button" id="dialogClose">Entendido</button>
 </section>
</div>
<script>
(() => {
  "use strict";
  // Introduce los enlaces reales aquí, cuando los tengas. Por ahora funcionan como vista de prueba.
  const enlacesPrecios = ["", "", ""];
  const enlacesRedes = {TikTok:"",Instagram:"",Facebook:"",YouTube:""};
  const servicios = [
    "Limpieza de tanques de agua",
    "Promociona tu negocio o marca",
    "Clases de música"
  ];
  const poster = document.getElementById("poster");
  const cards = [...document.querySelectorAll("[data-card]")];
  const slots = [...document.querySelectorAll("[data-price-slot]")];
  const dots = [...document.querySelectorAll(".carousel-dots i")];
  const dialog = document.getElementById("dialog");
  const title = document.getElementById("dialogTitle");
  const message = document.getElementById("dialogText");
  const positions = [2.73,35.16,65.82];
  let offset = 0;
  let busy = false;
  let startX = null, startY = null;
  let previousFocus = null;

  function currentOrder() {
    return [0,1,2].map(i => (i + offset) % 3);
  }
  function showOrder(animate, oldOffset = offset) {
    const order = currentOrder();
    order.forEach((id,slot) => {
      const card=cards[id];
      card.style.left=positions[slot] + "%";
    });
    slots.forEach((button,slot)=>button.setAttribute("aria-label","Ver precios: " + servicios[order[slot]]));
    dots.forEach((dot,i)=>dot.classList.toggle("current",i===offset));
  }
  // Dejar los tres servicios QUIETOS al abrir. Se mueven únicamente si la persona interactúa.
  showOrder(false);
  function move(direction) {
    if(busy) return;
    busy=true;
    if(!poster.classList.contains("moved")) {
      poster.classList.add("moved");
    }
    const oldOrder=currentOrder();
    const returning= direction>0 ? cards[oldOrder[0]] : cards[oldOrder[2]];
    returning.classList.add("returning");
    offset=(offset+direction+3)%3;
    requestAnimationFrame(()=>requestAnimationFrame(()=>showOrder(true)));
    window.setTimeout(()=>{returning.classList.remove("returning");busy=false;},900);
  }
  document.getElementById("prev").addEventListener("click",()=>move(-1));
  document.getElementById("next").addEventListener("click",()=>move(1));
  document.querySelectorAll("[data-page]").forEach(button=>button.addEventListener("click",()=>{
    const page=Number(button.dataset.page);
    if(page===offset) return;
    move((page-offset+3)%3===1?1:-1);
  }));
  poster.addEventListener("touchstart",ev=>{
    const rect=poster.getBoundingClientRect(), touch=ev.changedTouches[0];
    const y=(touch.clientY-rect.top)/rect.height;
    if(y<.46 || y>.83) return;
    startX=touch.clientX;startY=touch.clientY;
  },{passive:true});
  poster.addEventListener("touchend",ev=>{
    if(startX===null) return;
    const touch=ev.changedTouches[0];
    const dx=touch.clientX-startX,dy=touch.clientY-startY;
    startX=null;startY=null;
    if(Math.abs(dx)>35 && Math.abs(dx)>Math.abs(dy)*1.35) move(dx<0?1:-1);
  },{passive:true});
  // También se puede usar el teclado.
  poster.addEventListener("keydown",ev=>{
    if(ev.key==="ArrowRight"){ev.preventDefault();move(1)}
    if(ev.key==="ArrowLeft"){ev.preventDefault();move(-1)}
  });
  function openDialog(heading,body) {
    previousFocus=document.activeElement;
    title.textContent=heading;message.textContent=body;
    dialog.classList.add("visible");
    document.getElementById("dialogClose").focus();
  }
  function closeDialog() {
    dialog.classList.remove("visible");
    previousFocus?.focus();
  }
  slots.forEach((button,slot)=>button.addEventListener("click",()=>{
    const id=currentOrder()[slot], name=servicios[id], url=enlacesPrecios[id];
    if(url){window.location.href=url;return;}
    openDialog(name,"Este botón está preparado. Aquí colocaremos el enlace con los precios cuando lo tengas.");
  }));
  document.querySelectorAll("[data-social]").forEach(button=>button.addEventListener("click",()=>{
    const name=button.dataset.social,url=enlacesRedes[name];
    if(url){window.open(url,"_blank","noopener,noreferrer");return;}
    openDialog(name,"Este contador es una imagen de muestra. Aquí añadiremos el enlace de tu perfil y, después, los datos reales de seguidores.");
  }));
  document.getElementById("dialogClose").addEventListener("click",closeDialog);
  dialog.addEventListener("click",e=>{if(e.target===dialog)closeDialog()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&dialog.classList.contains("visible"))closeDialog()});
})();
</script>
