  <script>
  (()=>{'use strict';
    const services=document.getElementById('services');
    const cards=[...services.querySelectorAll('.service')];
    const dots=[...document.querySelectorAll('[data-dot]')];
    const dialog=document.getElementById('info');
    let current=0,touchStart=null;
    function render(){cards.forEach((card,i)=>{card.style.order=(i-current+cards.length)%cards.length});dots.forEach((dot,i)=>{dot.classList.toggle('active',i===current);dot.setAttribute('aria-current',String(i===current))})}
    function move(delta){current=(current+delta+cards.length)%cards.length;render()}
    document.getElementById('prev').addEventListener('click',()=>move(-1));
    document.getElementById('next').addEventListener('click',()=>move(1));
    dots.forEach(dot=>dot.addEventListener('click',()=>{current=Number(dot.dataset.dot);render()}));
    services.addEventListener('touchstart',event=>{touchStart={x:event.touches[0].clientX,y:event.touches[0].clientY}},{passive:true});
    services.addEventListener('touchend',event=>{if(!touchStart)return;const dx=event.changedTouches[0].clientX-touchStart.x,dy=event.changedTouches[0].clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.4)move(dx<0?1:-1)},{passive:true});
    function open(title,body){document.getElementById('info-title').textContent=title;document.getElementById('info-text').textContent=body;dialog.showModal()}
    document.getElementById('cart').addEventListener('click',()=>open('Tienda','La tienda de ropa cubana estará disponible próximamente.'));
    document.querySelector('[data-dialog="music"]').addEventListener('click',()=>open('Clases de música','Próximamente compartiremos la página de clases y sus precios.'));
    document.querySelector('[data-dialog="cleaning"]').addEventListener('click',()=>open('Limpieza y desinfección de tanques de agua','Disponible a partir del 1 de enero de 2027 en Ica.\n\nEste servicio profesional ayudará a retirar sedimentos y suciedad acumulada en las paredes y el fondo del tanque, seguido de la desinfección de su interior.\n\nPróximamente compartiremos las tarifas y los detalles para programar tu atención.'));
    document.getElementById('close').addEventListener('click',()=>dialog.close());
    dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
  })();
  </script>
  <script>

    const reach=document.getElementById('reach'),reachTotal=document.getElementById('reach-total');

    let totalShown=null,totalFrame=null;
    function animate(from,to,render,onEnd){if(reduced.matches||document.hidden||from===to){render(to);onEnd?.();return null}const started=performance.now(),duration=from===null?1600:700,initial=from??0,animation={id:null,cancel(){if(this.id!==null)cancelAnimationFrame(this.id)}};function step(now){const progress=Math.min(1,(now-started)/duration);render(Math.round(initial+(to-initial)*(1-(1-progress)**3)));if(progress<1){animation.id=requestAnimationFrame(step)}else{animation.id=null;onEnd?.()}}animation.id=requestAnimationFrame(step);return animation}
    function updateTotal(){if(sources.some(source=>source.value===null)){reach.dataset.state='waiting';reachTotal.textContent='—';return}const total=sources[0].value+sources[1].value;if(!Number.isSafeInteger(total))return;reach.dataset.state='ready';totalFrame?.cancel();totalFrame=animate(totalShown,total,value=>{reachTotal.textContent=format.format(value)},()=>{totalFrame=null});totalShown=total}
    async function update(source){if(source.busy||document.hidden)return;source.busy=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),17000);
      try{const response=await fetch(source.url,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw new Error('Fuente no disponible');const data=await response.json();const value=data[source.field];if(data.consulta_ok!==true||data.cuenta!==source.account||!Number.isSafeInteger(value)||value<0)throw new Error('Dato inválido');
        source.frame?.cancel();source.frame=animate(source.shown,value,n=>{source.node.textContent=format.format(n)},()=>{source.frame=null});source.shown=value;source.value=value;source.node.dataset.state=data.source_stale?'stale':'ready';source.node.title=`${format.format(value)} ${source.unit} · ${data.fuente}${data.source_stale?' · último dato disponible':''}`;source.link.setAttribute('aria-label',`Abrir ${source.name}: ${format.format(value)} ${source.unit}`);updateTotal();
      }catch(error){if(source.value===null){source.node.textContent='—';source.node.dataset.state='unavailable';source.node.title='Contador no disponible por ahora';}else{source.node.dataset.state='stale';source.node.title='Último dato recibido; no se pudo actualizar ahora';}}
      finally{clearTimeout(timer);source.busy=false}
    }
    function refresh(){sources.forEach(update)}
    refresh();setInterval(refresh,30000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
    window.addEventListener('online',refresh);
  })();
  </script>
</body>
